name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 校验发行标签与程序版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/DesktopTwin/DesktopTwin.csproj -Raw
          $expectedTag = "v$($project.Project.PropertyGroup.Version | Where-Object { $_ })"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "标签 $env:GITHUB_REF_NAME 与程序版本 $expectedTag 不一致"
          }

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: 还原
        run: dotnet restore DesktopTwin.sln --locked-mode

      - name: 编译并测试 Debug（包括原生冒烟项目）
        run: |
          dotnet build DesktopTwin.sln -c Debug --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test DesktopTwin.sln -c Debug --no-build --no-restore --blame-hang-timeout 2m

      - name: 编译（Release，警告视为错误）
        run: dotnet build DesktopTwin.sln -c Release --no-restore -warnaserror

      # 用 Windows PowerShell 而不是 pwsh：脚本在 5.1 上验证过，两个引擎的正则/编码行为不完全一致。
      - name: 校验 XAML 绑定与资源键
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-xaml.ps1

      # 安全常量必须只有一处定义。这类约束编译器管不到，测试也测不出来。
      - name: 校验常量单一来源
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build/verify-invariants.ps1

      - name: 单元测试
        run: >
          dotnet test tests/DesktopTwin.Tests/DesktopTwin.Tests.csproj -c Release --no-build --no-restore
          --collect:"XPlat Code Coverage" --blame-hang-timeout 2m
          --results-directory artifacts/test-results
          --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal"

      - name: 验证质量门禁会拒绝不合格结果
        run: ./build/test-quality-gates.ps1

      - name: 核心覆盖率、零跳过和零空测试门禁
        run: ./build/verify-test-results.ps1 -ResultsDirectory artifacts/test-results

      - name: 上传测试及完整应用覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

      # 一次产出两个版本：自带运行时的给普通用户，框架依赖的给已装 .NET 10 的机器。
      - name: 发布（自带运行时）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false
          -p:DebugType=none
          -p:RestoreLockedMode=true
          -o artifacts/publish/standalone

      - name: 发布（框架依赖）
        run: >
          dotnet publish src/DesktopTwin/DesktopTwin.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -p:RestoreLockedMode=true
          -o artifacts/publish/framework

      # 发布包只给最终用户看，调试符号既没用又占体积，还会暴露源码路径。
      - name: 剔除调试符号
        run: Get-ChildItem artifacts/publish -Filter *.pdb -Recurse | Remove-Item -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # 必须先 checkout 再下载产物：actions/checkout 默认 clean=true，
      # 会把工作区里未跟踪的文件（包括刚下载的 artifact）一起清掉。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: DesktopTwin-win-x64
          path: artifacts/publish

      # 文件名用英文并带版本号，和本地 build.ps1 产出的名字保持一致。
      # 三个文件直接作为 Release 附件，不再打 zip。
      #
      # 为什么不用中文文件名：GitHub 保存 Release 附件时会把中文截断
      # （桌面分身-0.2.2.exe -> -0.2.2.exe，使用说明.txt -> default.txt），
      # gh CLI 和 REST API 都试过，都拦不住。程序本身不依赖自身文件名，
      # 中文文件名照样能跑，只是发布环节改用英文。
      - name: 准备三个文件
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $stage = "stage"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          $standaloneExe = Join-Path $stage "DesktopTwin-$version.exe"
          $frameworkExe = Join-Path $stage "DesktopTwin-$version-NET10.exe"
          Copy-Item "artifacts/publish/standalone/DesktopTwin.exe" $standaloneExe
          Copy-Item "artifacts/publish/framework/DesktopTwin.exe" $frameworkExe

          # 两个 exe 名字相近，哈希要分别给出，所以写进说明文件里。
          $standaloneHash = (Get-FileHash $standaloneExe -Algorithm SHA256).Hash
          $frameworkHash = (Get-FileHash $frameworkExe -Algorithm SHA256).Hash

          $readme = (Get-Content "build/release-readme.txt" -Raw -Encoding UTF8).
            Replace("{{VERSION}}", $version).
            Replace("{{SHA256_STANDALONE}}", $standaloneHash).
            Replace("{{SHA256_FRAMEWORK}}", $frameworkHash)
          [System.IO.File]::WriteAllText(
            (Join-Path $stage "README.txt"),
            $readme,
            (New-Object System.Text.UTF8Encoding($true)))

          Get-ChildItem $stage | ForEach-Object {
            "$($_.Name)  $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)"
          }

      # 三个文件直接作为附件，不打 zip：用户点开就能下到要用的那一个。
      # 校验值写在 README.txt 里，不再单独出 SHA256SUMS.txt。
      - name: 创建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')

          # gh 将附件上传到草稿后才公开发行，避免留下可见但缺少附件的发行。
          # 优先使用仓库中的手写发行说明；没有对应文件时才生成说明。
          $notesFile = "build/release-notes/${{ github.ref_name }}.md"
          $files = @(Get-ChildItem "stage" -File | Select-Object -ExpandProperty FullName)
          if ($files.Count -ne 3) {
            throw "发行应包含两个程序和 README，实际发现 $($files.Count) 个文件"
          }
          if (Test-Path $notesFile) {
            gh release create "${{ github.ref_name }}" @files --repo "$env:GITHUB_REPOSITORY" --title "v$version" --notes-file $notesFile --verify-tag --latest
          } else {
            gh release create "${{ github.ref_name }}" @files --repo "$env:GITHUB_REPOSITORY" --title "v$version" --generate-notes --verify-tag --latest
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release 发布失败，退出码 $LASTEXITCODE"
          }
